# issuer information
issuer_url = https://www.escp.org
issuer_email = contact@escp.org
issuer_name = University of ESCP
issuer_id = https://www.blockcerts.org/samples/2.0/issuer-testnet.json #here ESCP should have its own issuer profile on its servers
revocation_list=https://www.blockcerts.org/samples/2.0/revocation-list-testnet.json # here ESCP should have its own revocation list on its servers : list of certificates issued but revoked.
# This allows a student for instant (recipient in general use case) to loose his public key if he lost it, or if it was stolen.
# Also allows the issuer to revoke a certificate if it was issued by mistake or if the recipient cheated. Can't erase any certificate from the blockchain, but can make it useless by revoking it.
issuer_public_key=ecdsa-koblitz-pubkey:msBCHdwaQ7N2ypBYupkp6uNxtr9Pg76imj #See readme perso for why there is this prefix
issuer_logo_file = images/logo.png

